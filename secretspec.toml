[project]
name = "redpanda-lab"
revision = "1.0"
require_reason = true

[providers]
runtime-environment = "env://"

[profiles.default]
PROJECT_NAME = { description = "Public project identity; not a credential", required = false, prompt = false, default = "redpanda-lab", providers = ["null"] }

[profiles.stripe-sandbox.defaults]
inherit = false

[profiles.stripe-sandbox]
STRIPE_TEST_SECRET_KEY = { description = "Stripe test-mode secret key for the explicitly authorized POS sandbox", required = true, prompt = false, providers = ["runtime-environment"], ref = { item = "STRIPE_TEST_SECRET_KEY" } }

[profiles.square-sandbox.defaults]
inherit = false

[profiles.square-sandbox]
SQUARE_SANDBOX_ACCESS_TOKEN = { description = "Square sandbox access token for the explicitly authorized POS sandbox", required = true, prompt = false, providers = ["runtime-environment"], ref = { item = "SQUARE_SANDBOX_ACCESS_TOKEN" } }
SQUARE_SANDBOX_LOCATION_ID = { description = "Square sandbox location identifier for the explicitly authorized POS sandbox", required = true, prompt = false, providers = ["runtime-environment"], ref = { item = "SQUARE_SANDBOX_LOCATION_ID" } }
