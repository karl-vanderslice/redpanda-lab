x-agent: &agent
  image: ${LAB_APP_IMAGE}
  networks: [lab]
  init: true
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m,mode=1777
  restart: unless-stopped
  depends_on:
    redpanda:
      condition: service_healthy
    model:
      condition: service_healthy
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 10s

services:
  app:
    <<: *agent
    environment:
      LAB_ROLE: app
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    depends_on:
      redpanda:
        condition: service_healthy
      planner:
        condition: service_healthy
      reviewer:
        condition: service_healthy
  planner:
    <<: *agent
    environment:
      LAB_ROLE: planner
      KAFKA_BROKERS: redpanda:9092
      MODEL_URL: http://model:8080/v1
  reviewer:
    <<: *agent
    environment:
      LAB_ROLE: reviewer
      KAFKA_BROKERS: redpanda:9092
      MODEL_URL: http://model:8080/v1
  model:
    image: ${LAB_MODEL_IMAGE}
    networks: [lab]
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
