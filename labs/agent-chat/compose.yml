services:
  app:
    image: ${LAB_APP_IMAGE}
    networks: [lab]
    environment:
      KAFKA_BROKERS: redpanda:9092
      CHAT_TOPIC: agent-chat-events
      MODEL_URL: http://model:8080/v1
    ports:
      - "127.0.0.1:${APP_PORT}:3000"
    depends_on:
      redpanda:
        condition: service_healthy
      model:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 5s
  model:
    image: ${LAB_MODEL_IMAGE}
    networks: [lab]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
